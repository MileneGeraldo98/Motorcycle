<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=League+Spartan:wght@100..900&family=Lexend+Deca:wght@100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./login.css">
    <title>Motocycle</title>
</head>
<body>
    <div class="page-container">
        <div class="image-container">
            <img src="../Images/Motocycle.jpg" alt="Motocycle">
        </div>
    </div>
    <div class="main-container">
        <form action="" method="get" class="form-login" id="LoginForm">
            <h4 class="p-login">Entrar no site</h4>
            <div>
                <input class="button" type="text" id="email" placeholder="E-mail">
                <input class="button" type="password" id="senha" placeholder="Senha">
            </div>
            <div>
                <input type="submit" value="Login" class="submit">
            </div>

            <p id="mensagem"></p>
            
        </form>
    <script src="../script.js"></script>
    </div>
</body>
</html>
